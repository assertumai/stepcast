version: 1
kind: job
name: migrate
description: Прогнать виджеты через смену таблицы общих модулей и поставить исправленные версии в очередь предложений

params:
  # Виджет для миграции — id либо `all`; пусто (умолчание) значит «только
  # устаревшие» (`widget-migration`, «Миграцию можно направить на названный
  # виджет»).
  widget: { type: string, default: "" }

# `cwd`, а не `worktree`/`copy` (design.md, Решение 12): каталог виджетов
# часто не отслежен git, и в дереве, ответвлённом от HEAD, его просто не
# было бы. Дверь одна — `stepcast propose`, остальные закрыты правами, а не
# режимом рабочей директории.
workspace:
  mode: cwd

steps:
  - id: agent
    agent: claude
    prompt: file:../prompts/migrate-widgets.md
    permissions:
      # Ни Edit, ни Write над рабочим деревом — правка кабинета идёт только
      # через `stepcast propose`; `Write` над каталогом черновиков даёт
      # положить туда исправленную версию, не касаясь дерева проекта
      # (design.md, Решение 12).
      allow:
        - Read
        - "Write(${run.scratch}/**)"
        # Ровно та форма вызова, которой промпт учит агента: движок зовётся
        # `node "$STEPCAST_BIN"` по той же причине, что в `survey.yml`
        # (исполняемый бит не гарантирован, движок прогона может быть снимком
        # в каталоге прогона, и `PATH` движок не дополняет —
        # `src/parts/pipeline/run/exec/env.ts`). Голое имя оставлено вторым правом: на
        # машине с установленным пакетом агент вправе позвать и его, но
        # полагаться на `PATH` промпт не учит.
        - 'Bash(node "$STEPCAST_BIN" propose *)'
        - "Bash(stepcast propose *)"
      enforce: strict
