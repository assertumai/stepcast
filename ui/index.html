      (`test/ui-widgets.test.ts`, «карта имён страницы»). Разойдись они, и
      виджет получил бы «неизвестный спецификатор» вместо хука.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "/widgets/runtime/react.js",
          "react-dom": "/widgets/runtime/react-dom.js",
          "react/jsx-runtime": "/widgets/runtime/jsx-runtime.js"
        }
      }
