# Петля саморазвития: stepcast улучшает сам stepcast.
#
# Заход берёт до двух свободных пунктов из backlog.md — по одному на дорожку
# — и ведёт их одновременно: propose → plan → implement → review →
# fix-review → verify на каждой. Дорожка без свободного пункта пропускает всю
# свою цепочку.
#
# Общей сессии у работ дорожки нет, и это результат замера, а не умолчание по
# недосмотру. Движок умеет сводить работы в один диалог ключом обвязки
# session_group; заход 245605 прошёл с двумя группами (propose+plan+implement
# и review+fix-review) и дал: время на единицу изменения в норме — 3.20 минуты
# на сто строк при базе 2.79-3.54, — а стоимость худшую из пяти заходов: $1.73
# на сто строк при базе, плотной до ±2% (1.24, 1.25, 1.28, 1.30).
#
# Причина в том, что́ наследуется. Свежая сессия вычитывает репозиторий
# выборочно, только нужное её задаче; унаследованный диалог тащит всё, чем
# занимался предшественник, в префиксе каждого следующего хода. Цена хода у
# работ, диалог унаследовавших, удвоилась ровно вслед за префиксом (plan
# 0.041-0.052 -> 0.102, fix-review 0.032-0.048 -> 0.095), а число ходов упало
# (implement 163 против 201-303): ходов меньше, каждый дороже — время встало
# на месте, деньги выросли на треть.
#
# Возвращать группы имеет смысл, если появится способ нести дальше вывод
# работы, а не её диалог целиком. После того как обе дорожки дошли до verify (или были
# пропущены), work merge накладывает зелёные дорожки на дерево проекта по
# очереди, проверяя каждую свежей объявленной командой (project.check ниже)
# перед коммитом. work finalize
# проставляет failed пунктам дорожек, которые до done не дошли.
#
#   stepcast lint .stepcast/pipelines/self-improve.yml
#   stepcast run  .stepcast/pipelines/self-improve.yml
#
# Требует чистого рабочего дерева: отказ прошлого захода останавливает петлю до
# разбора человеком, а не наслаивает следующее улучшение на сломанный код.
# Чистоту проверяет work slots, до того как какая-либо дорожка тронет копию.

version: 1
kind: pipeline
name: self-improve

# Команда проверки этого репозитория. Объявлена здесь, а не в
# .stepcast/config.yml: заход петли не может завести этот файл сейчас — он не
# входит в границы правок implement и fix-review, — а пайплайн в границах уже
# есть. Перенос в конфигурацию возможен любым следующим заходом, одной
# строкой, и не затронет ни работ, ни промптов: они видят действующее
# значение через ${project.check}, а не слой, на котором оно объявлено.
#
# Инструменты репозитория — та же причина, тот же слой: implement и
# fix-review читают их подстановкой ${project.tools}, а не литералами
# Bash(npm *)/Bash(npx *)/Bash(node *) в файле работы, и репозиторий на другом
# стеке переносит петлю правкой одной этой строки.
#
# Группа spec — та же причина, тот же слой: практика спецификации этого
# репозитория (OpenSpec) объявлена здесь, а не в .stepcast/config.yml, ровно
# потому что заход петли пока не может завести этот файл. Работы и промпты
# петли не называют OpenSpec литералом — они читают объявление подстановкой
# ${project.spec.*}, и репозиторий без OpenSpec переносит петлю правкой одних
# этих трёх строк, без правки внутри скопированных файлов.
#
# Границы правок — та же причина, тот же слой: implement и fix-review читают
# их подстановкой ${project.edit_paths}, а не двенадцатью литералами в файле
# работы, и репозиторий на другом стеке переносит петлю правкой этого списка,
# без единой правки внутри работ.
project:
  check: npm run check
  tools: [npm, npx, node]
  spec:
    dir: openspec/changes
    rules: .stepcast/prompts/spec-rules.md
    tool: openspec
  edit_paths:
    - src/**
    - test/**
    - docs/**
    # Схемы формата — часть кода, а не постороннее: изменение, вводящее
    # настройку или поле, обязано их обновить, иначе объявленный формат
    # разойдётся с принимаемым.
    - schema/**
    # Инструментарий сборки и проверки: скрипты без dist/ (как
    # scripts/status.mjs) входят в реализацию наравне с src/.
    - scripts/**
    # Фронт витрины и его сборка: живут вне src/, но по сути — тот же код
    # движка (ui-navigation переносит их с неслитой ветки).
    - ui/**
    - package.json
    # Изменение, вносящее зависимость, обязано обновить и замок: держать его
    # за границей значило требовать заведомо рассогласованного дерева.
    # Согласованность замка с package.json стережёт отдельный пункт очереди
    # lockfile-drift, а не запрет его трогать.
    - package-lock.json
    - vite.config.ts
    - eslint.config.js
    - README.md
    - .gitattributes

# worktree: дорожки идут одновременно и не должны видеть правок друг друга —
# review одной не имеет права застать implement другой. slots, merge и
# finalize переопределяют режим на cwd: они не производят параллельных правок
# кода и должны видеть/трогать дерево проекта напрямую.
workspace:
  mode: worktree

# По числу дорожек: меньше — и вторая дожидалась бы свободного места
# впустую, хотя обе не зависят друг от друга до merge.
concurrency: 2
fail_fast: false

# CLAUDE.md здесь сознательно нет: в этом репозитории его и не заводили, а
# Claude Code подгружает его сам — свой и родительские, — и stepcast этого не
# подавляет. Дублировать подгружаемое бэкендом значило бы платить за него
# дважды.
context:
  - path: docs/status.md
    mode: reference
  - text: |
      Это репозиторий самого stepcast. Правки движка проверяются командой
      ${project.check} — она гоняет типизацию, линт и тесты.
      Сгенерированное в dist/ не трогать: оно пересобирается сборкой.
      Для проверки кода используй только ${project.check} (или отдельные части:
      npm run typecheck, npm run lint, npm run test:only). Не вызывай
      npm run build и npm test напрямую — они пересобирают dist/ и
      могут нарушить бегущий процесс stepcast.

defaults:
  agent: claude
  session: shared

# Единственный потолок — на весь заход, денежный, а не токенный: две дорожки
# читают контекст параллельно, и трафик прогона (см. limits в конфигурации)
# перестал быть надёжным ориентиром на двух одновременных сессиях.
#
# $40 не хватало: три из четырёх двухдорожечных прогонов упёрлись в потолок
# ровно на $40-44, потому что fix-review обеих дорожек (opus) идёт
# одновременно и удваивает темп расхода именно там, где потолок ближе всего.
# $50 — предел, разрешённый встроенным limits.cost (TIGHTEN_ONLY: проектный
# конфиг может его только понизить, поднять — только ~/.stepcast/config.yml
# человеком на своей машине). Даже он не гарантия против дорогого захода —
# наблюдённый пик уже $44.30, — но не требует трогать конфигурацию за
# пределами этого репозитория.
budget:
  cost: $50
  wallclock: 4h
  rate_limit_pct: 80
  # on_exceed: wait реализован и усыпляет прогон до сброса окна подписки, но
  # денежный потолок он не ждёт — тот останавливает прогон в любом случае.
  # Здесь stop сознательно: ночного захода нет, а сон до утра приятнее
  # встретить осознанно.
  on_exceed: stop

jobs:

  slots:
    uses: ../jobs/slots.yml
    workspace: { mode: cwd }
    # Подпись узла в витрине. Самоссылка законна ровно здесь: display не
    # проходит через раскрытие определения работы (там данных ещё нет) — его
    # раскрывает витрина в момент отрисовки, когда pick-lanes уже записала
    # выбранный заголовок командой stepcast data.
    display:
      title: ${jobs.slots.data.title}

  # --- Дорожка a ---

  propose-a:
    uses: ../jobs/propose.yml
    with: { lane: a }
    lane: a
    needs: [slots]
    workspace: { inherit: none }
    # Неопределённое значение (слот не заполнен, а то и вовсе work slots не
    # дошла до успеха) сравнением с true даёт false — работа пропускается,
    # а не запускается на пустоте.
    if: "jobs.slots.output.lanes.a.filled == true"

  plan-a:
    uses: ../jobs/plan.yml
    with: { change: "${jobs.propose-a.output.slug}" }
    lane: a
    needs: [propose-a]

  implement-a:
    uses: ../jobs/implement.yml
    with: { change: "${jobs.propose-a.output.slug}", lane: a }
    lane: a
    needs: [plan-a]

  review-a:
    uses: ../jobs/review.yml
    with: { change: "${jobs.propose-a.output.slug}" }
    lane: a
    needs: [implement-a]

  fix-review-a:
    uses: ../jobs/fix-review.yml
    with: { change: "${jobs.propose-a.output.slug}" }
    lane: a
    needs: [review-a]

  verify-a:
    uses: ../jobs/verify.yml
    with: { change: "${jobs.propose-a.output.slug}" }
    lane: a
    needs: [fix-review-a]

  # --- Дорожка b: та же цепочка, те же файлы работ ---

  propose-b:
    uses: ../jobs/propose.yml
    with: { lane: b }
    lane: b
    needs: [slots]
    workspace: { inherit: none }
    if: "jobs.slots.output.lanes.b.filled == true"

  plan-b:
    uses: ../jobs/plan.yml
    with: { change: "${jobs.propose-b.output.slug}" }
    lane: b
    needs: [propose-b]

  implement-b:
    uses: ../jobs/implement.yml
    with: { change: "${jobs.propose-b.output.slug}", lane: b }
    lane: b
    needs: [plan-b]

  review-b:
    uses: ../jobs/review.yml
    with: { change: "${jobs.propose-b.output.slug}" }
    lane: b
    needs: [implement-b]

  fix-review-b:
    uses: ../jobs/fix-review.yml
    with: { change: "${jobs.propose-b.output.slug}" }
    lane: b
    needs: [review-b]

  verify-b:
    uses: ../jobs/verify.yml
    with: { change: "${jobs.propose-b.output.slug}" }
    lane: b
    needs: [fix-review-b]

  # --- Сведение и завершение ---

  # on: always — дорожка с пустым слотом даёт verify статусом skipped, а не
  # success, и без always merge не запустилась бы вовсе.
  merge:
    uses: ../jobs/merge.yml
    workspace: { mode: cwd }
    needs: [verify-a, verify-b]
    on: always

  # needs: all и on: always — единственная конструкция формата, отрабатывающая
  # и при отмене, и при остановке по бюджету, в том числе до того, как
  # запустилась merge.
  finalize:
    uses: ../jobs/finalize.yml
    workspace: { mode: cwd }
    needs: all
    on: always
