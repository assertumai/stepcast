# Объявление этого репозитория: команда проверки, инструменты, практика
# спецификации и границы правок.
#
# Раньше секция project целиком жила верхним ключом документа
# .stepcast/pipelines/self-improve.yml — единственная причина была в том, что
# заход петли не мог завести этот файл сам (.stepcast/config.yml не входил в
# edit_paths implement/fix-review). Перенос сюда — тот самый следующий заход,
# который был назван в пайплайне заранее.
#
# Здесь секция видна и подстановке ${project.*} документа пайплайна (слой не
# отменяется — resolveConfig проектного файла подмешивается в раскрытие), и
# командам движка, которые читают конфигурацию напрямую и подстановки не
# видят вовсе: stepcast assert-clean (объявленный состав вложенных
# репозиториев) и stepcast project repos (это же объявление плюс check и spec
# каждого вложенного репозитория) — обеим неоткуда прочитать секцию, живи она
# только в документе пайплайна.
version: 1
kind: config

project:
  check: npm run check
  # Имена, а не готовые записи прав (форма права знает файл работы, не
  # конфигурацию): implement и fix-review читают их подстановкой
  # ${project.tools}, а не литералами Bash(npm *)/Bash(npx *)/Bash(node *) в
  # файле работы, и репозиторий на другом стеке переносит петлю правкой одной
  # этой строки.
  tools: [npm, npx, node]
  # Практика спецификации этого репозитория — OpenSpec. Работы и промпты
  # петли не называют OpenSpec литералом — они читают объявление подстановкой
  # ${project.spec.*} (корень) либо параметром дорожки (репозиторий,
  # объявивший себя объектной формой nested_repos), и репозиторий без
  # OpenSpec переносит петлю правкой этих трёх строк, без правки внутри
  # скопированных файлов.
  spec:
    dir: openspec/changes
    rules: .stepcast/prompts/spec-rules.md
    tool: openspec
  # Границы правок репозитория: implement и fix-review читают их подстановкой
  # ${project.edit_paths}, а не литералами в файле работы, и репозиторий на
  # другом стеке переносит петлю правкой этого списка, без единой правки
  # внутри работ. Остаётся корневым списком независимо от вложенных
  # репозиториев (design.md изменения backlog-item-names-repo, Non-Goals):
  # границы правок по вложенному репозиторию — отдельная возможность.
  edit_paths:
    - src/**
    - test/**
    - docs/**
    # Схемы формата — часть кода, а не постороннее: изменение, вводящее
    # настройку или поле, обязано их обновить, иначе объявленный формат
    # разойдётся с принимаемым.
    - schema/**
    # Инструментарий сборки и проверки: скрипты без dist/ (как
    # scripts/status.mjs) входят в реализацию наравне с src/.
    - scripts/**
    # Фронт витрины и его сборка: живут вне src/, но по сути — тот же код
    # движка (ui-navigation переносит их с неслитой ветки).
    - ui/**
    - package.json
    # Изменение, вносящее зависимость, обязано обновить и замок: держать его
    # за границей значило требовать заведомо рассогласованного дерева.
    # Согласованность замка с package.json стережёт отдельный пункт очереди
    # lockfile-drift, а не запрет его трогать.
    - package-lock.json
    - vite.config.ts
    - eslint.config.js
    - README.md
    - .gitattributes
