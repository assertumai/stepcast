# Работа: устранить находки ревью.
#
# Собственного context на artifacts/review.json нет и не нужно: выход работы-
# предшественника попадает в контекст агентских шагов автоматически.

version: 1
kind: job
name: fix-review
description: Устранить находки ревью до зелёной объявленной проверки

params:
  change: { type: string, required: true }
  # Каталог, команда проверки и практика спецификации выбранного репозитория
  # — та же причина, что в implement.yml: пункт очереди мог назвать вложенный
  # репозиторий, и правка находки обязана гнать проверку и инструмент именно
  # его.
  repo_dir: { type: string, required: true }
  check: { type: string, required: true }
  spec_dir: { type: string, required: true }
  spec_rules: { type: string, required: true }
  spec_tool: { type: string, required: true }

session: shared

# Файл правил вставкой — по той же причине, что в implement.yml: устранение
# находки правит код и обязано соблюдать ту же практику репозитория, включая
# то, что она требует обновить по итогам правки.
context:
  - path: ${params.spec_rules}
    mode: inline

output:
  from: apply-fixes
  schema: ../schemas/implement.json

until:
  max_iterations: 2
  check:
    # cd, а не поле cwd шага: см. verify.yml.
    - cmd: cd "${params.repo_dir}" && ${params.check}
    # Инструмент практики спецификации выбранного репозитория — по той же
    # причине, что в implement.yml: устранение находки правит документы
    # изменения наравне с кодом, и ломает их так же незаметно.
    - cmd: cd "${params.repo_dir}" && ${params.spec_tool} validate "${params.change}" --strict

steps:
  # Модель того же класса, что и у ревью: находки сформулировал opus, и модель
  # послабее закрывала бы замечания, которых не понимает целиком.
  - id: apply-fixes
    agent: claude
    model: opus
    prompt: file:../prompts/fix-review.md
    output_schema: ../schemas/implement.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(${project.tools} *)
        # git — инструмент движка, а не репозитория (worktree, tree_id,
        # changed_only без него не работают нигде), поэтому остаётся
        # литералом, а не переезжает в project.tools.
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 30m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          # Раскладка репозитория — объявлена project.edit_paths, а не здесь:
          # см. implement.yml. Остаётся корневой.
          - ${project.edit_paths}
          # Каталог документов изменения — параметром выбранного репозитория:
          # см. implement.yml.
          - ${params.spec_dir}/**
          - ${params.spec_rules}
          # Устройство петли: каталог .stepcast/ задаёт движок, а не
          # репозиторий — тот же критерий, по которому литералом осталось
          # Bash(git status*).
          - .stepcast/config.yml
          - .stepcast/jobs/**
          - .stepcast/pipelines/**
          - .stepcast/prompts/**
          - .stepcast/schemas/**
    attempts:
      max: 2
      escalation:
        - include_failure: true
