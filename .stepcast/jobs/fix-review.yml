# Работа: устранить находки ревью.
#
# Собственного context на artifacts/review.json нет и не нужно: выход работы-
# предшественника попадает в контекст агентских шагов автоматически.

version: 1
kind: job
name: fix-review
description: Устранить находки ревью до зелёной объявленной проверки

params:
  change: { type: string, required: true }

session: shared

# Файл правил вставкой — по той же причине, что в implement.yml: устранение
# находки правит код и обязано соблюдать ту же практику репозитория, включая
# то, что она требует обновить по итогам правки.
context:
  - path: ${project.spec.rules}
    mode: inline

output:
  from: apply-fixes
  schema: ../schemas/implement.json

until:
  max_iterations: 2
  check:
    - cmd: ${project.check}

steps:
  # Модель того же класса, что и у ревью: находки сформулировал opus, и модель
  # послабее закрывала бы замечания, которых не понимает целиком.
  - id: apply-fixes
    agent: claude
    model: opus
    prompt: file:../prompts/fix-review.md
    output_schema: ../schemas/implement.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(npm *)
        - Bash(npx *)
        - Bash(node *)
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 30m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          - src/**
          - test/**
          - docs/**
          - ${project.spec.dir}/**
          # Схемы формата — часть кода, а не постороннее: изменение, вводящее
          # настройку или поле, обязано их обновить, иначе объявленный формат
          # разойдётся с принимаемым.
          - schema/**
          - scripts/**
          - package.json
          # См. implement.yml: замок ходит вместе с package.json.
          - package-lock.json
          - .gitattributes
          # Конфигурация проекта — часть петли (объявляет, например,
          # project.check), и завести её должен уметь заход, а не человек.
          # Действует со следующего прогона: предикат фиксируется вместе с
          # раскрытым пайплайном в начале текущего.
          - .stepcast/config.yml
          - .stepcast/prompts/**
          - .stepcast/jobs/**
          - .stepcast/pipelines/**
          - ui/**
          - vite.config.ts
          - README.md
          - .stepcast/schemas/**
          - eslint.config.js
          # Правила спецификации — часть петли, а не сторонний файл: см.
          # implement.yml — заход обязан уметь их поправить.
          - ${project.spec.rules}
    attempts:
      max: 2
      escalation:
        - include_failure: true
