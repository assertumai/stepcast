# Работа: устранить находки ревью.
#
# Собственного context на artifacts/review.json нет и не нужно: выход работы-
# предшественника попадает в контекст агентских шагов автоматически.

version: 1
kind: job
name: fix-review
description: Устранить находки ревью до зелёного npm run check

params:
  change: { type: string, required: true }

session: shared

output:
  from: apply-fixes
  schema: ../schemas/implement.json

until:
  max_iterations: 2
  check:
    - cmd: npm run check

steps:
  # Модель того же класса, что и у ревью: находки сформулировал opus, и модель
  # послабее закрывала бы замечания, которых не понимает целиком.
  - id: apply-fixes
    agent: claude
    model: opus
    prompt: file:../prompts/fix-review.md
    output_schema: ../schemas/implement.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(npm *)
        - Bash(npx *)
        - Bash(node *)
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 30m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          - src/**
          - test/**
          - docs/**
          - openspec/changes/**
          # Схемы формата — часть кода, а не постороннее: изменение, вводящее
          # настройку или поле, обязано их обновить, иначе объявленный формат
          # разойдётся с принимаемым.
          - schema/**
          - scripts/**
          - package.json
          # См. implement.yml: замок ходит вместе с package.json.
          - package-lock.json
          - .gitattributes
          - .stepcast/prompts/**
          - .stepcast/jobs/**
          - .stepcast/pipelines/**
          - ui/**
          - vite.config.ts
          - README.md
          - .stepcast/schemas/**
          - eslint.config.js
    attempts:
      max: 2
      escalation:
        - include_failure: true
