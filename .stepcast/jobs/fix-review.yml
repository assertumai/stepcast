# Работа: устранить находки ревью.
#
# Собственного context на artifacts/review.json нет и не нужно: выход работы-
# предшественника попадает в контекст агентских шагов автоматически.

version: 1
kind: job
name: fix-review
description: Устранить находки ревью до зелёного npm run check

params:
  change: { type: string, required: true }

session: shared

output:
  from: apply-fixes
  schema: ../schemas/implement.json

until:
  max_iterations: 2
  check:
    - cmd: npm run check

steps:
  # Модель того же класса, что и у ревью: находки сформулировал opus, и модель
  # послабее закрывала бы замечания, которых не понимает целиком.
  - id: apply-fixes
    agent: claude
    model: opus
    prompt: file:../prompts/fix-review.md
    output_schema: ../schemas/implement.json
    permissions:
      allow:
        - Read
        - Edit
        - Write
        - Bash(npm *)
        - Bash(npx *)
        - Bash(node *)
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 30m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          - src/**
          - test/**
          - docs/**
          - openspec/changes/**
    attempts:
      max: 2
      escalation:
        - include_failure: true
