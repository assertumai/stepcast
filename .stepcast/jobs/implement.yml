# Работа: реализовать задачи из плана до зелёной сборки, линта и тестов.

version: 1
kind: job
name: implement
description: Реализовать задачи из плана до зелёного npm run check

params:
  change: { type: string, required: true }
  lane: { type: string, required: true }

session: shared

# План — единственный нужный выход предшественника: proposal уже развёрнут в
# нём, а повторная вставка только раздувает стартовый кеш сессии. Имя работы
# плана несёт суффикс дорожки — общий job-файл сам его не знает, и суффикс
# приходит параметром с места подключения.
context_upstream: ["plan-${params.lane}"]

context:
  - openspec/changes/${params.change}/tasks.md
  - path: "openspec/changes/${params.change}/specs/**/*.md"
    mode: reference

output:
  from: write-code
  schema: ../schemas/implement.json

# Числа литералами: подстановка в числовые поля пока не работает — схема
# документа проверяется до раскрытия. Снимается пунктом очереди
# numeric-field-substitution.
until:
  max_iterations: 4
  check:
    - cmd: npm run check

steps:
  # Модель младшая: работа механическая по готовому плану, самая токеноёмкая в
  # петле (итерации × попытки), а её результат проверяется объективным гейтом
  # npm run check — ошибка видна сразу и не проносится дальше по графу.
  # Эскалация модель не повышает: подмешивается только вывод прошлой неудачи.
  - id: write-code
    agent: claude
    model: sonnet
    # Все файлы остаются доступны агенту, но крупные спеки попадают в prompt
    # ссылками: сначала читается задача, затем только нужная для неё спека.
    context_max_tokens: 8k
    prompt: file:../prompts/implement.md
    output_schema: ../schemas/implement.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(npm *)
        - Bash(npx *)
        - Bash(node *)
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 40m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          - src/**
          - test/**
          - docs/**
          - openspec/changes/**
          # Схемы формата — часть кода, а не постороннее: изменение, вводящее
          # настройку или поле, обязано их обновить, иначе объявленный формат
          # разойдётся с принимаемым.
          - schema/**
          # Инструментарий сборки и проверки: скрипты без dist/ (как
          # scripts/backlog.mjs), правки конфигурации сборщика и промпты
          # агентских работ входят в реализацию наравне с src/.
          - scripts/**
          - package.json
          - .gitattributes
          - .stepcast/prompts/**
          # Устройство самого пайплайна: пункты, меняющие движок исполнения
          # (дорожки, зависимые рабочие деревья, триггеры), обязаны обновить
          # и то, что этим движком управляет.
          - .stepcast/jobs/**
          - .stepcast/pipelines/**
          - .stepcast/schemas/**
          # Фронт витрины и его сборка: живут вне src/, но по сути — тот же
          # код движка (ui-navigation переносит их с неслитой ветки).
          - ui/**
          - vite.config.ts
          - README.md
    attempts:
      max: 3
      escalation:
        - include_failure: true
        - include_failure: true
