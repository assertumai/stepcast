# Работа: реализовать задачи из плана до зелёной объявленной проверки.

version: 1
kind: job
name: implement
description: Реализовать задачи из плана до объявленной командой проверки

params:
  change: { type: string, required: true }
  lane: { type: string, required: true }

session: shared

# План — единственный нужный выход предшественника: proposal уже развёрнут в
# нём, а повторная вставка только раздувает стартовый кеш сессии. Имя работы
# плана несёт суффикс дорожки — общий job-файл сам его не знает, и суффикс
# приходит параметром с места подключения.
context_upstream: ["plan-${params.lane}"]

# Документы изменения — одним входом глобом, ссылкой: вставлять по имени
# больше нечего — работа не знает их состава, — а порог
# context.inline_threshold и так переводил крупные документы в ссылки. Промпт
# прямо велит начать с чек-листа задач изменения, раз он теперь доступен
# ссылкой, а не текстом. required: true — как в plan.yml: пустой глоб отправил
# бы реализацию работать без единого документа.
#
# Файл правил вставкой: в нём сказано, из чего состоят документы изменения и
# что репозиторий требует обновить по итогам реализации, — знание, зависящее
# от практики, и потому не место ему в промпте работы.
context:
  - path: "${project.spec.dir}/${params.change}/**/*.md"
    mode: reference
    required: true
  - path: ${project.spec.rules}
    mode: inline

output:
  from: write-code
  schema: ../schemas/implement.json

# Цикла until здесь нет намеренно, и это следствие группы сессий: его новая
# итерация начинает сессии заново, а сессия группы живёт дольше работы —
# «заново» оборвало бы диалог работам, которые уже закончились. Линт такое
# сочетание отклоняет. Гейт проверки поэтому переехал в expect шага, а
# повторение — в его attempts: тот же объективный порог, та же обратная связь
# (вывод падения подмешивается следующей попытке через include_failure), но
# повторяется один шаг, а не работа.
steps:
  # Модель младшая: работа механическая по готовому плану, самая токеноёмкая в
  # петле (итерации × попытки), а её результат проверяется объективным гейтом
  # ${project.check} — ошибка видна сразу и не проносится дальше по графу.
  # Эскалация модель не повышает: подмешивается только вывод прошлой неудачи.
  - id: write-code
    agent: claude
    model: sonnet
    # Все файлы остаются доступны агенту, но крупные спеки попадают в prompt
    # ссылками: сначала читается задача, затем только нужная для неё спека.
    context_max_tokens: 8k
    prompt: file:../prompts/implement.md
    output_schema: ../schemas/implement.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(${project.tools} *)
        # git — инструмент движка, а не репозитория (worktree, tree_id,
        # changed_only без него не работают нигде), поэтому остаётся
        # литералом, а не переезжает в project.tools.
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 40m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          # Раскладка репозитория — объявлена project.edit_paths, а не здесь:
          # репозиторий на другом стеке переносит петлю правкой того списка,
          # без единой правки внутри этой работы.
          - ${project.edit_paths}
          # Каталог документов изменения объявлен project.spec, отдельным
          # ключом: репозиторий, объявивший spec.dir, уже сказал, где они
          # лежат, и повторять тот же путь здесь значило бы завести способ
          # рассогласовать два объявления.
          - ${project.spec.dir}/**
          # Файл правил — та же причина: отдельная запись, а не только
          # ${project.spec.dir}/**, — он может лежать вне каталога документов
          # изменения.
          - ${project.spec.rules}
          # Устройство петли: каталог .stepcast/ задаёт движок, а не
          # репозиторий, и в объявлении границ репозитория ему не место —
          # тот же критерий, по которому литералом осталось Bash(git status*).
          - .stepcast/config.yml
          - .stepcast/jobs/**
          - .stepcast/pipelines/**
          - .stepcast/prompts/**
          - .stepcast/schemas/**
      # Объявленная команда проверки репозитория — тем же предикатом, что
      # прежде стоял в until работы.
      - cmd: ${project.check}
      # Документы изменения объявленная команда проверки не смотрит — она
      # гоняет типизацию, линт и тесты кода, и про практику спецификации не
      # знает ничего. Проверяет её собственный инструмент, объявленный
      # ${project.spec.tool}, и здесь он предикатом движка, а не правом
      # агента: проверка детерминированная и стоит доли секунды на весь
      # каталог, а ходы агента она бы тратила на каждой правке документов.
      - cmd: ${project.spec.tool} validate "${params.change}" --strict
    attempts:
      max: 4
      escalation:
        - include_failure: true
        - include_failure: true
        - include_failure: true
