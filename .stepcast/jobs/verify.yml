# Работа: финальная проверка вне цикла итераций.
#
# ${params.check} внутри until гоняется ради быстрой обратной связи агенту;
# эта работа — чистый прогон снаружи, и её статус определяет исход улучшения.
#
# Команда, инструмент и каталог исполнения приходят параметрами дорожки, а не
# ${project.*}: пункт очереди мог назвать вложенный репозиторий, и гейт
# обязан проверять именно его, а не корень (self-improvement-loop,
# «Гейты дорожки исполняются в каталоге выбранного репозитория»). Пункт,
# назвавший корень (в том числе не назвавший ничего), даёт params.repo_dir
# равным "." — то же дерево, что и до этого изменения.
#
# Один шаг, а не перечень частей: движок не разбирает объявленную команду —
# она строка, устройство которой знает только объявивший её, — а перечень
# шагов, повторяющий это устройство своим списком, расходится с ним при
# первой же правке команды. Так уже случилось: четыре шага (typecheck, lint,
# build, test:only) не включали typecheck:ui, входящий в
# объявленную команду проверки этого репозитория, — работа, чей исход решал
# судьбу улучшения, проверяла не то же, что цикл until двумя работами раньше.
# Ценой становится гранулярность журнала: имя упавшей части читается из
# вывода шага, а не из его идентификатора.

version: 1
kind: job
name: verify
description: Объявленная команда проверки на итоговом дереве, в каталоге выбранного репозитория

params:
  change: { type: string, required: true }
  repo_dir: { type: string, required: true }
  check: { type: string, required: true }
  spec_tool: { type: string, required: true }

steps:
  # cd, а не поле cwd у шага: движок не заводит его ради одного потребителя,
  # тогда как остальные шаги работы обязаны остаться в корне дерева. У корня
  # разворачивается в `cd "." && …` — тождественно прежнему поведению.
  - id: check
    run: cd "${params.repo_dir}" && ${params.check}
    timeout: 30m
    expect: [{ exit_code: 0 }]

  # Второй шаг — не разбор объявленной команды на части (против которого
  # написано выше), а другой гейт: код проверяет params.check, документы
  # изменения — инструмент практики спецификации выбранного репозитория, и ни
  # один из них не проверяет то, что проверяет другой. Здесь он повторно
  # после until обеих правящих работ по той же причине, по которой
  # повторяется сама проверка: цикл until гоняет её ради обратной связи
  # агенту, а исход улучшения решает чистый прогон снаружи.
  - id: validate-spec
    run: cd "${params.repo_dir}" && ${params.spec_tool} validate "${params.change}" --strict
    timeout: 2m
    expect: [{ exit_code: 0 }]
