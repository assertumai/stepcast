# Работа: финальная проверка вне цикла итераций.
#
# ${project.check} внутри until гоняется ради быстрой обратной связи агенту;
# эта работа — чистый прогон снаружи, и её статус определяет исход улучшения.
#
# Один шаг, а не перечень частей: движок не разбирает объявленную команду —
# она строка, устройство которой знает только объявивший её, — а перечень
# шагов, повторяющий это устройство своим списком, расходится с ним при
# первой же правке команды. Так уже случилось: четыре шага (typecheck, lint,
# build, test:only) не включали typecheck:ui и status:check, входящие в
# ${project.check} этого репозитория, — работа, чей исход решал судьбу
# улучшения, проверяла не то же, что цикл until двумя работами раньше.
# Ценой становится гранулярность журнала: имя упавшей части читается из
# вывода шага, а не из его идентификатора.

version: 1
kind: job
name: verify
description: Объявленная команда проверки на итоговом дереве

steps:
  - id: check
    run: ${project.check}
    timeout: 30m
    expect: [{ exit_code: 0 }]
