# Работа: свести дорожки, наложив каждую на дерево проекта по очереди.
#
# Режим переопределён на cwd на месте подключения: наложение и проверка идут
# в дереве проекта, а не в снимке. needs называет verify обеих дорожек явно,
# on: always — дорожка, чей propose не запустился (слот пуст), даёт verify
# статусом skipped, а не success, и без always work merge не запустилась бы
# вовсе.
#
# Команда проверки доходит подстановкой ${project.check}, раскрытой при
# разборе пайплайна, — не через конфигурацию: `merge-lanes` принимает её
# ключом `--check` и по-прежнему ничего не знает о том, чем проверяется этот
# конкретный репозиторий. Кавычки вокруг подстановки те же, что были вокруг
# литерала: значение доезжает до `sh -c` как есть, экранирование сложной
# команды — на её авторе (см. docs/config.md).

version: 1
kind: job
name: merge
description: Наложить дорожки по очереди, проверить и закоммитить зелёную

steps:
  - id: merge-lanes
    run: [sh, -c, '"$STEPCAST_BIN" merge-lanes "$STEPCAST_RUN_ID" --lanes a,b --check "${project.check}"']
    # Объявленная команда гоняется внутри, на дорожку, дважды при двух
    # дорожках — запас кратно щедрее, чем у одиночного verify.
    timeout: 30m
    expect: [{ exit_code: 0 }]
