# Работа: свести дорожки, наложив каждую на дерево проекта по очереди.
#
# Режим переопределён на cwd на месте подключения: наложение и проверка идут
# в дереве проекта, а не в снимке. needs называет verify обеих дорожек явно,
# on: always — дорожка, чей propose не запустился (слот пуст), даёт verify
# статусом skipped, а не success, и без always work merge не запустилась бы
# вовсе.

version: 1
kind: job
name: merge
description: Наложить дорожки по очереди, проверить и закоммитить зелёные

steps:
  - id: merge-lanes
    run: [node, scripts/merge-lanes.mjs, --lanes, 'a,b']
    # npm run check гоняется внутри, на дорожку, дважды при двух дорожках —
    # запас кратно щедрее, чем у одиночного verify.
    timeout: 30m
    expect: [{ exit_code: 0 }]
