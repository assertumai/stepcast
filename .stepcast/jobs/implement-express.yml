# Работа: реализовать изменение по его чек-листу до зелёной объявленной
# проверки — облегчённая цепочка.
#
# От implement.yml отличается тем, чего у облегчённой дорожки нет: работы
# плана. Плана и не будет — чек-лист задач изменения и есть план, — и
# `context_upstream` здесь поэтому отсутствует, а не наследуется пустым.
# Параметр lane по той же причине не нужен: он служил только для того, чтобы
# назвать работу плана своей дорожки.
#
# Всё остальное — модель, границы правок, цикл until с объявленной проверкой
# и строгим разбором документов — то же самое: облегчённой цепочке снимают
# ревью, а не гейты.

version: 1
kind: job
name: implement-express
description: Реализовать изменение по его чек-листу до объявленной командой проверки

params:
  change: { type: string, required: true }
  # Каталог, команда проверки и практика спецификации выбранного репозитория
  # — параметрами дорожки, а не ${project.*}: пункт очереди мог назвать
  # вложенный репозиторий (self-improvement-loop, «Гейты дорожки исполняются
  # в каталоге выбранного репозитория» и «Документы изменения пишутся по
  # практике выбранного репозитория»). Пункт, назвавший корень, даёт те же
  # значения, что ${project.*} давал до этого изменения.
  repo_dir: { type: string, required: true }
  check: { type: string, required: true }
  spec_dir: { type: string, required: true }
  spec_rules: { type: string, required: true }
  spec_tool: { type: string, required: true }

session: shared

# Документы изменения — одним входом глобом, ссылкой: вставлять по имени
# больше нечего — работа не знает их состава, — а порог
# context.inline_threshold и так переводил крупные документы в ссылки. Промпт
# прямо велит начать с чек-листа задач изменения, раз он теперь доступен
# ссылкой, а не текстом. required: true — как в plan.yml: пустой глоб отправил
# бы реализацию работать без единого документа.
#
# Файл правил вставкой: в нём сказано, из чего состоят документы изменения и
# что репозиторий требует обновить по итогам реализации, — знание, зависящее
# от практики, и потому не место ему в промпте работы.
context:
  - path: "${params.spec_dir}/${params.change}/**/*.md"
    mode: reference
    required: true
  - path: ${params.spec_rules}
    mode: inline

output:
  from: write-code
  schema: ../schemas/implement.json

# Числа литералами: подстановка в числовые поля пока не работает — схема
# документа проверяется до раскрытия. Снимается пунктом очереди
# numeric-field-substitution.
until:
  max_iterations: 4
  check:
    # cd, а не поле cwd шага: см. verify.yml. У корня — `cd "." && …`,
    # тождественно прежнему поведению.
    - cmd: cd "${params.repo_dir}" && ${params.check}
    # Документы изменения объявленная команда проверки не смотрит — она гоняет
    # типизацию, линт и тесты кода, и про практику спецификации не знает
    # ничего. Проверяет её собственный инструмент практики выбранного
    # репозитория, и здесь он шагом движка, а не правом агента: проверка
    # детерминированная и стоит доли секунды на весь каталог, а ходы агента
    # она бы тратила на каждой правке документов. Вывод падения доезжает до
    # следующей итерации тем же путём, что и вывод красной сборки, — правило
    # «чини причину, а не симптом» из промпта работает и для спеки.
    - cmd: cd "${params.repo_dir}" && ${params.spec_tool} validate "${params.change}" --strict

steps:
  # Модель младшая: работа механическая по готовому плану, самая токеноёмкая в
  # петле (итерации × попытки), а её результат проверяется объективным гейтом
  # ${params.check} — ошибка видна сразу и не проносится дальше по графу.
  # Эскалация модель не повышает: подмешивается только вывод прошлой неудачи.
  - id: write-code
    agent: claude
    model: sonnet
    # Все файлы остаются доступны агенту, но крупные спеки попадают в prompt
    # ссылками: сначала читается задача, затем только нужная для неё спека.
    context_max_tokens: 8k
    prompt: file:../prompts/implement-express.md
    output_schema: ../schemas/implement.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(${project.tools} *)
        # git — инструмент движка, а не репозитория (worktree, tree_id,
        # changed_only без него не работают нигде), поэтому остаётся
        # литералом, а не переезжает в project.tools.
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 40m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          # Раскладка репозитория — объявлена project.edit_paths, а не здесь:
          # репозиторий на другом стеке переносит петлю правкой того списка,
          # без единой правки внутри этой работы. Остаётся корневым: границы
          # правок по вложенному репозиторию — не эта возможность.
          - ${project.edit_paths}
          # Каталог документов изменения — параметром выбранного репозитория,
          # склеенным от корня дерева (${params.spec_dir}, см. params выше), а
          # не ${project.spec.dir}: репозиторий, объявивший spec.dir, уже
          # сказал, где они лежат, и повторять тот же путь здесь значило бы
          # завести способ рассогласовать два объявления.
          - ${params.spec_dir}/**
          # Файл правил — та же причина: отдельная запись, а не только
          # ${params.spec_dir}/**, — он может лежать вне каталога документов
          # изменения.
          - ${params.spec_rules}
          # Устройство петли: каталог .stepcast/ задаёт движок, а не
          # репозиторий, и в объявлении границ репозитория ему не место —
          # тот же критерий, по которому литералом осталось Bash(git status*).
          - .stepcast/config.yml
          - .stepcast/jobs/**
          - .stepcast/pipelines/**
          - .stepcast/prompts/**
          - .stepcast/schemas/**
    attempts:
      max: 3
      escalation:
        - include_failure: true
        - include_failure: true
