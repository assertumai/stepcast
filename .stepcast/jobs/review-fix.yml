# Работа: отревьюить сделанное и устранить находки — в одной сессии.
#
# Слияние бывших review и fix-review. Граница между ними ничего не стерегла:
# исправляющий и так получал находки ревьюера через выход предшественника —
# только текстом заново, в новой сессии, заново вычитывающей diff и документы
# изменения. В общей сессии он видит не список находок, а рассуждение, из
# которого тот список вырос.
#
# Граница, которая стерегла существенное, осталась на месте: ревьюер сидит в
# сессии, отдельной от той, где писался рецензируемый код (см. build.yml).
#
# Права разведены по шагам, а не по работам: у ревью нет Edit и Write, и это
# по-прежнему ограничение движка, а не просьба в промпте.

version: 1
kind: job
name: review-fix
description: Отревьюить изменения рабочего дерева и устранить находки

params:
  change: { type: string, required: true }

session: shared

# Документы изменения — в контексте работы, а не шага: в отличие от build они
# существуют к началу работы, и общая сессия отправит их один раз на оба шага.
# required: true — глоб без совпадений оставил бы ревьюера без документов, не
# сказав об этом.
context:
  - path: "${project.spec.dir}/${params.change}/**/*.md"
    required: true
  # Файл правил: устранение находки правит документы изменения наравне с
  # кодом и обязано соблюдать ту же практику репозитория.
  - path: ${project.spec.rules}
    mode: inline

output:
  from: apply-fixes
  schema: ../schemas/implement.json

steps:
  # --- Найти ---
  #
  # Права только на чтение: шаг ищет, но не правит.
  - id: review-diff
    agent: claude
    model: opus
    prompt: file:../prompts/review.md
    output_schema: ../schemas/review.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Bash(git diff*)
        - Bash(git log*)
        - Bash(git status*)
    timeout: 25m
    expect:
      - schema: ../schemas/review.json
      - changed_only: []
    attempts:
      max: 2
      escalation:
        - include_failure: true

  # --- Устранить ---
  #
  # Модель того же класса, что и у ревью: находки сформулировал opus, и модель
  # послабее закрывала бы замечания, которых не понимает целиком. В общей
  # сессии это к тому же буквально тот же диалог.
  #
  # Гейт проверки — предикатом шага, а не циклом until работы: причина та же,
  # что в build.yml, — until погнал бы на повтор и ревью, которое ни в чём не
  # виновато и стоит двадцать пять минут opus.
  - id: apply-fixes
    agent: claude
    model: opus
    prompt: file:../prompts/fix-review.md
    output_schema: ../schemas/implement.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(${project.tools} *)
        # git — инструмент движка, а не репозитория, поэтому литералом.
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 30m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          - ${project.edit_paths}
          - ${project.spec.dir}/**
          - ${project.spec.rules}
          - .stepcast/config.yml
          - .stepcast/jobs/**
          - .stepcast/pipelines/**
          - .stepcast/prompts/**
          - .stepcast/schemas/**
      - cmd: ${project.check}
      - cmd: ${project.spec.tool} validate "${params.change}" --strict
    attempts:
      max: 3
      escalation:
        - include_failure: true
        - include_failure: true
