# Работа: проставить failed каждому взятому пункту дорожки, чей исход ещё не
# проставлен. Коммит сведённой дорожки — забота work merge, а не этой работы:
# finalize её не дублирует.
#
# Подключается с needs: all и on: always — только так она отрабатывает и при
# отмене по сигналу, и при остановке по бюджету, когда до merge заход не
# дошёл вовсе.

version: 1
kind: job
name: finalize
description: Проставить failed пунктам дорожек, чей исход ещё не проставлен

steps:
  - id: settle
    run: [node, scripts/finalize.mjs]
    timeout: 3m
    expect: [{ exit_code: 0 }]
