# Работа: проставить failed каждому взятому пункту дорожки, чей исход ещё не
# проставлен, и закоммитить свою правку очереди адресно (stepcast backlog
# settle) — отдельным коммитом от вклада merge, в том репозитории, где
# очередь лежит. Коммит сведённой дорожки остаётся заботой merge: settle
# коммитит только отметку исхода дорожек, которую сам проставил.
#
# Подключается с needs: all и on: always, и объявляет budget_exempt: true —
# без освобождения исчерпанный потолок прогона остановил бы её раньше, чем
# она успеет отработать при отмене по сигналу или при остановке по бюджету,
# когда до merge заход не дошёл вовсе.

version: 1
kind: job
name: finalize
description: Проставить failed пунктам дорожек, чей исход ещё не проставлен

steps:
  - id: settle
    run: [sh, -c, '"$STEPCAST_BIN" backlog settle --run-dir "$STEPCAST_RUN_DIR"']
    timeout: 3m
    expect: [{ exit_code: 0 }]
