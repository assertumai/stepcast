# Работа: записать в память репозитория то, что заход узнал, и проверить,
# что память не разошлась с кодом.
#
# Три шага, и разделение между ними не косметическое. Агент **не правит файлы
# памяти** — он кладёт описание единицы в каталог черновиков работы, а пишет
# движок командой `stepcast knowledge write`. Причина в единственном
# свойстве, ради которого дрейф вообще ловится: ревизию якоря подставляет
# движок, а не пишущий. Правь агент файл напрямую — он писал бы якорь без
# ревизии, устаревание по такому якорю не считается вовсе, и вся вторая
# половина замысла оказалась бы выключена молча. Ровно это и было в первой
# версии этой работы.
#
# То же соображение, что в implement.yml про инструмент спецификации:
# детерминированное действие ценой доли секунды — шаг движка, а не право
# агента, потому что правом агента оно стоило бы ходов на каждой попытке.
#
# Память — корневого репозитория, а не выбранного пунктом очереди:
# `project.knowledge` объявляется один раз на дерево, как и `nested_repos`.
# Дорожка, взявшая вложенный репозиторий, пишет в память корня — своей у
# вложенного пока нет, и притворяться, что есть, работа не станет.

version: 1
kind: job
name: remember
description: Записать узнанное в память репозитория и проверить её целостность

params:
  change: { type: string, required: true }
  knowledge_rules: { type: string, required: true }

context:
  - knowledge: index
  - path: ${params.knowledge_rules}

steps:
  # Агент решает, что запомнить, и ничего не пишет в дерево: `changed_only`
  # пуст намеренно — ни одного изменённого пути. Единственное, что он создаёт,
  # — файл описания в каталоге черновиков работы, который лежит вне рабочего
  # дерева при любом режиме workspace и потому предикату границ не виден.
  - id: draft
    agent: claude
    prompt: file:../prompts/remember.md
    timeout: 15m
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Write
        - Bash(git diff*)
        - Bash(git log*)
    expect:
      - changed_only: []

  # Описания нет — заходу нечего было запомнить, и это законный исход, а не
  # отказ: правила письма прямо разрешают не добавлять ничего.
  - id: record
    run: >
      sh -c 'f="$STEPCAST_SCRATCH/knowledge.json";
      [ -f "$f" ] || { echo "заход ничего не запомнил"; exit 0; };
      "$STEPCAST_BIN" knowledge write --file "$f"'
    timeout: 5m
    expect:
      - exit_code: 0
      # Предикат смотрит на то же дерево, в котором шаг только что писал
      # (источник знания заводится по рабочей директории работы), — поэтому
      # он здесь и осмыслен, в отличие от прежнего места на агентском шаге,
      # который в дерево не пишет вовсе.
      - knowledge_valid: true

  # Второй гейт — по всему дереву, а не только по записанному: правка кода
  # этого захода делает жёлтыми единицы, которых он не касался, и увидеть это
  # должна дорожка, а не следующий заход. Красным становится просроченное.
  - id: check
    run: '"$STEPCAST_BIN" knowledge check'
    timeout: 5m
    expect: [{ exit_code: 0 }]
