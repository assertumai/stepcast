# Работа: завести изменение, спланировать его и реализовать — в одной сессии.
#
# Слияние трёх бывших работ (propose, plan, implement) не перестановка ради
# опрятности, а единственный доступный сегодня способ дать им общую сессию:
# реестр сессий живёт в исполнении работы, и граница работы обрывает диалог
# вместе с кешем промптов (см. docs/pipeline-format.md, раздел «Сессии»).
# Три отдельные работы означали три сессии, каждая из которых заново
# вычитывала репозиторий: 20-45 млн токенов чтения кеша на заход.
#
# Слаг изменения приходит параметром от work slots, а не из выхода первого
# шага: выражения ${jobs.*} раскрываются один раз на работу, до первого её
# шага, и шаг не может сослаться на структурный выход соседа по сессии.
# Брать его от слотов законно: формат очереди объявляет заголовок пункта
# слагом изменения, и все шесть заходов 2026-08-29 подтвердили совпадение.
#
# Ревью осталось отдельной работой сознательно — граница работы даёт
# независимую сессию, и ревьюер по-прежнему не сидит в том диалоге, где сам
# писал рецензируемый код.

version: 1
kind: job
name: build
description: Завести изменение, спланировать и реализовать его в одной сессии

params:
  lane: { type: string, required: true }
  change: { type: string, required: true }

session: shared

# Файл правил — один раз на всю сессию, а не по вставке в каждую из бывших
# работ: общий контекст уходит в первое сообщение сессии, и повторять агенту
# прочитанное незачем. Это же снимает известный дефект формата о повторной
# отправке файла, объявленного шагом сессии второй раз.
context:
  - path: ${project.spec.rules}
    mode: inline

output:
  from: write-code
  schema: ../schemas/implement.json

steps:
  # --- Завести описание изменения ---
  #
  # Модель старшая: формулировка изменения задаёт всё, что делают следующие
  # два шага, а автоматического гейта на неё нет.
  - id: create-change
    agent: claude
    model: opus
    prompt: file:../prompts/propose.md
    context:
      - path: ${run.dir}/item-${params.lane}.json
        mode: inline
    output_schema: ../schemas/propose.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(${project.spec.tool} *)
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    # 40m, а не 20: пункт, задевающий несколько спек, столько и пишется.
    # pipeline-lanes (четыре спеки) не уложился в 20m дважды подряд.
    timeout: 40m
    expect:
      - schema: ../schemas/propose.json
      - changed_only:
          - ${project.spec.dir}/**
    attempts:
      max: 2
      escalation:
        - include_failure: true

  # --- Составить план реализации ---
  #
  # Документы изменения глобом на шаге, а не в контексте работы: на старте
  # работы их ещё нет — их заводит шаг выше, — и required: true на контексте
  # работы отказал бы до того, как им откуда взяться. Контекст шага
  # собирается в момент его исполнения, и к этому мигу каталог уже полон.
  - id: read-change
    agent: claude
    model: opus
    prompt: file:../prompts/plan.md
    context:
      - path: "${project.spec.dir}/${params.change}/**/*.md"
        required: true
    output_schema: ../schemas/plan.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Bash(git log*)
        - Bash(git diff*)
    timeout: 20m
    expect:
      - schema: ../schemas/plan.json
      # План не реализует: дерево после него должно остаться нетронутым.
      - changed_only: []
    attempts:
      max: 2
      escalation:
        - include_failure: true

  # --- Реализовать ---
  #
  # Модель младшая: работа механическая по готовому плану, самая токеноёмкая
  # в петле, а её результат проверяется объективным гейтом ниже.
  #
  # Гейт проверки переехал из цикла until работы в expect этого шага. Причина
  # ровно в слиянии: until — цикл работы целиком, и красная сборка отправила
  # бы на повтор ещё и заведение изменения с планированием, то есть двадцать
  # минут opus за чужую ошибку. Предикат cmd на шаге даёт тот же гейт с той
  # же обратной связью (вывод падения подмешивается следующей попытке через
  # include_failure), но повторяет один шаг. Побочная выгода: неудачная
  # попытка остаётся в диалоге сессии, тогда как новая итерация until
  # начинала сессии заново.
  - id: write-code
    agent: claude
    model: sonnet
    context:
      - path: "${project.spec.dir}/${params.change}/**/*.md"
        mode: reference
        required: true
    output_schema: ../schemas/implement.json
    prompt: file:../prompts/implement.md
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(${project.tools} *)
        # git — инструмент движка, а не репозитория (worktree, tree_id,
        # changed_only без него не работают нигде), поэтому остаётся
        # литералом, а не переезжает в project.tools.
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    timeout: 40m
    expect:
      - schema: ../schemas/implement.json
      - changed_only:
          # Раскладка репозитория — объявлена project.edit_paths, а не здесь.
          - ${project.edit_paths}
          - ${project.spec.dir}/**
          - ${project.spec.rules}
          # Устройство петли: каталог .stepcast/ задаёт движок, а не
          # репозиторий, и в объявлении границ репозитория ему не место.
          - .stepcast/config.yml
          - .stepcast/jobs/**
          - .stepcast/pipelines/**
          - .stepcast/prompts/**
          - .stepcast/schemas/**
      - cmd: ${project.check}
      # Документы изменения объявленная команда проверки не смотрит — она
      # гоняет типизацию, линт и тесты кода. Практику спецификации проверяет
      # её собственный инструмент, и здесь он предикатом движка, а не правом
      # агента: проверка детерминированная и стоит доли секунды.
      - cmd: ${project.spec.tool} validate "${params.change}" --strict
    attempts:
      max: 4
      escalation:
        - include_failure: true
        - include_failure: true
        - include_failure: true
