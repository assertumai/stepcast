# Работа: завести описание изменения под пункт очереди, выданный дорожке.
#
# Выбор пункта из очереди больше не входит в эту работу: слоты дорожек и
# проверку чистоты дерева делает работа slots — одна на весь заход, до того
# как какая-либо дорожка тронет рабочую копию. Эта работа читает уже выданный
# пункт из файла своей дорожки.
#
# Место документов, правила их написания и имя инструмента — объявление
# выбранного репозитория, а не эта работа: она получает файл правил
# контекстом и право на объявленный инструмент, не зная его имени заранее.
# Приходят параметрами дорожки (self-improvement-loop, «Документы изменения
# пишутся по практике выбранного репозитория»), а не ${project.spec.*}: пункт
# очереди мог назвать вложенный репозиторий.

version: 1
kind: job
name: propose
description: Завести описание изменения под пункт очереди, выданный дорожке

params:
  spec_dir: { type: string, required: true }
  spec_rules: { type: string, required: true }
  spec_tool: { type: string, required: true }

session: shared

output:
  from: create-change
  schema: ../schemas/propose.json

steps:
  - id: create-change
    agent: claude
    model: opus
    prompt: file:../prompts/propose.md
    context:
      - path: ${run.dir}/item-${job.lane}.json
        mode: inline
      - path: ${params.spec_rules}
        mode: inline
    output_schema: ../schemas/propose.json
    permissions:
      enforce: strict
      allow:
        - Read
        - Grep
        - Glob
        - Edit
        - Write
        - Bash(${params.spec_tool} *)
        - Bash(git status*)
        - Bash(git diff*)
        - Bash(git log*)
    # 40m, а не 20: пункт, задевающий несколько спек, столько и пишется.
    # pipeline-lanes (четыре спеки) не уложился в 20m дважды подряд, потратив
    # 25 минут на первой попытке, — и обе попытки ушли впустую вместе с
    # написанным. Работа здесь однократная и потолок прогона её страхует.
    timeout: 40m
    expect:
      - schema: ../schemas/propose.json
      - changed_only:
          - ${params.spec_dir}/**
    attempts:
      max: 2
      escalation:
        - include_failure: true
