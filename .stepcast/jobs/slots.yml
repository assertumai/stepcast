# Работа: предусловие петли и раздача слотов по дорожкам.
#
# Голова всего пайплайна: чистое дерево проверяется здесь и только здесь, до
# того как какая-либо дорожка тронет рабочую копию. Режим переопределён на cwd
# на месте подключения в пайплайне: работа не производит правок кода и живёт
# в каталоге запуска, где и стоит проверять его чистоту.

version: 1
kind: job
name: slots
description: Проверить чистоту дерева и раздать слоты дорожек из очереди улучшений

# Слаг пункта, который берётся в работу вместо первого свободного по
# очерёдности, — так доска витрины запускает пайплайн «для этой работы»
# (экран «Доска», перевод пункта в колонку in progress). Пустая строка —
# обычный отбор очереди: значение по умолчанию оставляет петлю ровно такой,
# какой она была до появления параметра, и ночной заход о нём не знает.
params:
  item: { type: string, default: '' }

# Ключи выбора, которые публикует backlog pick --lanes a шага pick-lanes:
# title (общая подпись) и title-a, slug-a (по дорожке a). Список меняется
# вместе с --lanes — вернувшаяся дорожка b добавит title-b и slug-b.
data: [title, title-a, slug-a]

output:
  from: pick-lanes
  schema: stepcast:backlog-slots

steps:
  # Свой вызов git здесь не годится: он смотрит состояние одного каталога, а
  # объявленные вложенные репозитории (project.nested_repos) в него не
  # попадают — игнорируемый вложенный пропадает из виду целиком. Состав
  # вдобавок сознательно не публикуется подстановкой ${project.*} (форма
  # состояния дерева, а не значение документа), и файлу работы прочитать его
  # неоткуда — поэтому проверка звана командой бинаря, которая читает
  # конфигурацию сама.
  - id: guard-clean-tree
    run: [sh, -c, '"$STEPCAST_BIN" assert-clean']
    timeout: 1m
    expect: [{ exit_code: 0 }]

  # Одна дорожка, хотя пайплайн описывает две. Пять двухдорожечных заходов из
  # шести упирались в денежный потолок на fix-review — два opus-шага идут
  # одновременно и удваивают темп расхода там, где до потолка ближе всего, —
  # и работа недоведённой дорожки выбрасывалась целиком: заход на $55 давал
  # один сведённый пункт против $7-33 у одиночного. Потолок поднять нечем:
  # $50 — встроенный limits.cost, а он TIGHTEN_ONLY. Дорожка b при этом
  # остаётся в пайплайне и проходит по ветке пропуска (filled == false),
  # которая проверяется этим же заходом; вернуть a,b — правка одной строки.
  # Заголовок выбранного пункта команда публикует данными работы сама, если
  # исполняется внутри шага: она уже знает пункт, и отдельный шаг ради
  # выковыривания того же значения из JSON был бы лишним процессом. Витрина
  # показывает его подписью узла — см. display на месте подключения работы.
  #
  # Конвейер, а не одна команда: раздача (backlog) и разрешение репозитория
  # (project repos) — разные команды нарочно: `backlog` остаётся переносимой и
  # конфигурации не читает вовсе. Второе звено читает конфигурацию само и
  # дополняет заполненную дорожку объявлением её репозитория (каталог,
  # команда проверки, практика спецификации), которое работы дорожек a и b
  # получают параметрами с места подключения. Пустой либо неразбираемый вход
  # второго звена — тоже отказ разбора, поэтому отказ первого звена доезжает
  # ненулевым кодом шага без опоры на set -o pipefail, которого POSIX sh не
  # обязан знать.
  # Названный пункт добавляет ключ --only, неназванный не добавляет ничего:
  # пустой --only движок отверг бы, а подставлять слово по умолчанию некуда —
  # «любой свободный» именем не выражается. Ветвление на стороне sh, а не
  # пайплайна: двух почти одинаковых шагов с if по одному параметру стоило бы
  # избегать там, где разница — одно слово команды.
  - id: pick-lanes
    run:
      [
        sh,
        -c,
        'if [ -n "${params.item}" ]; then ONLY="--only ${params.item}"; else ONLY=""; fi; "$STEPCAST_BIN" backlog pick --lanes a $ONLY --run-dir "$STEPCAST_RUN_DIR" | "$STEPCAST_BIN" project repos',
      ]
    timeout: 1m
    output_schema: stepcast:backlog-slots
    expect:
      - schema: stepcast:backlog-slots
