# Реализация OpenSpec change: план -> реализация до зелёных тестов -> ревью ->
# архивация. Отказ уводит в разбор, а не в слепой повтор.
#
#   scarp lint --budget examples/openspec-change.yml
#   scarp run examples/openspec-change.yml --input change=add-oauth-e2e-tests
#
# Работы implement и review вынесены в отдельные файлы и переиспользуемы;
# остальные описаны на месте. Связи и условия живут только здесь.

version: 1
kind: pipeline
name: openspec-change

inputs:
  change:
    type: string
    required: true
  skip_review:
    type: bool
    default: false

env:
  NODE_ENV: test
env_inherit: minimal

# Видят все агентские шаги прогона. Идёт началом промпта, одинаковым для всех
# шагов, — на этом и держатся попадания в кеш.
context:
  - AGENTS.md
  - text: |
      Монорепозиторий. Сгенерированные файлы в build/ не трогать.
      Тесты запускаются только через npm test, напрямую раннер не звать.

# GH_TOKEN не пробрасывается через env_passthrough: он попадает под запрет
# "*_TOKEN" из конфига, и запреты не отменяются снизу. Учётные данные идут
# через secrets — там маскирование в логах и точечная выдача работам.
secrets:
  GITHUB_TOKEN: ${host.GH_TOKEN}

defaults:
  agent: claude
  workspace: worktree

budget:
  tokens: 1.5M
  wallclock: 90m
  rate_limit_pct: 80
  on_exceed: pause

concurrency: 2

jobs:

  plan:
    description: Разобрать change и составить план работ
    budget:
      tokens: 80k
    outputs:
      plan: reports/plan.json
    steps:
      - id: read-change
        agent: claude
        prompt: file:./prompts/read-change.md
        context:
          - openspec/changes/${inputs.change}/proposal.md
          - openspec/changes/${inputs.change}/design.md
          - openspec/changes/${inputs.change}/tasks.md
        output:
          file: reports/plan.json
          schema: ./schemas/plan.json
        expect:
          - file_exists: reports/plan.json
          - schema: ./schemas/plan.json

  implement:
    uses: ./jobs/implement.yml
    with:
      change: ${inputs.change}
      max_iterations: 4
    needs: [plan]

  typecheck:
    description: Статические проверки
    needs: [implement]
    steps:
      - id: tsc
        run: npx tsc --noEmit
        expect:
          - exit_code: 0
      - id: lint
        run: npm run lint
        expect:
          - exit_code: 0

  review:
    uses: ./jobs/review.yml
    with:
      severity_gate: high
    needs: [typecheck]
    when: "not inputs.skip_review"

  archive:
    description: Синхронизировать спеки и заархивировать change
    needs: [review]
    when: all_ok
    secrets: [GITHUB_TOKEN]
    steps:
      - id: sync
        run: npx openspec sync ${inputs.change}
        expect:
          - exit_code: 0
      - id: archive
        run: npx openspec archive ${inputs.change}
        expect:
          - exit_code: 0

  triage:
    description: Разбор отказа — что именно не сошлось и почему
    needs: all
    when: any_failed
    budget:
      tokens: 120k
    outputs:
      analysis: reports/triage.md
    steps:
      - id: analyze
        agent: claude
        prompt: file:./prompts/triage.md
        context:
          - ${run.dir}/status.json
        expect:
          - file_exists: reports/triage.md
