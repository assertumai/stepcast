# Работа: ревью получившегося диффа.

version: 1
kind: job
name: review
description: Ревью изменений против плана

params:
  severity_gate:
    type: string
    default: high

budget:
  tokens: 200k

outputs:
  findings: reports/review.json

steps:
  - id: review-diff
    agent: claude
    prompt: file:../prompts/review.md
    output:
      file: reports/review.json
      schema: ../schemas/review.json
    expect:
      - schema: ../schemas/review.json
      - judge: "Нет незакрытых замечаний уровня ${params.severity_gate}"
        hard: true
