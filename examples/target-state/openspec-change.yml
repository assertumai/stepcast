# Реализация OpenSpec change: план -> реализация до зелёных тестов -> ревью ->

# ВНИМАНИЕ: этот пример НЕ запускается текущим срезом — он использует until
# и on_exceed: wait. Запускаемый пример лежит в examples/minimal/.
# архивация. Отказ уводит в разбор.
#
#   scarp lint --budget examples/openspec-change.yml
#   scarp run examples/openspec-change.yml --input change=add-oauth-e2e-tests

version: 1
kind: pipeline
name: openspec-change

inputs:
  change: { type: string, required: true }
  skip_review: { type: bool, default: false }

# cwd — результат остаётся в текущем дереве, возвращать нечего.
# Для параллельного прогона нескольких работ ставь worktree и concurrency > 1.
workspace:
  mode: cwd

env:
  NODE_ENV: test

# Видят все агентские шаги прогона.
context:
  - AGENTS.md
  - text: |
      Сгенерированные файлы в build/ не трогать.
      Тесты запускаются только через npm test.

defaults:
  agent: claude
  session: shared

budget:
  tokens: 1.5M
  wallclock: 90m
  rate_limit_pct: 80
  on_exceed: wait

concurrency: 1
fail_fast: true

jobs:

  plan:
    description: Разобрать change и составить план работ
    budget: { tokens: 80k }
    output:
      from: read-change
      schema: ./schemas/plan.json
    steps:
      - id: read-change
        agent: claude
        prompt: file:./prompts/read-change.md
        context:
          - openspec/changes/${inputs.change}/proposal.md
          - openspec/changes/${inputs.change}/design.md
          - openspec/changes/${inputs.change}/tasks.md
        output_schema: ./schemas/plan.json
        timeout: 15m
        expect:
          - schema: ./schemas/plan.json

  # Выход plan попадает в контекст автоматически — передавать его руками
  # через with или context не нужно.
  implement:
    uses: ./jobs/implement.yml
    with:
      change: ${inputs.change}
      max_iterations: 4
    needs: [plan]

  typecheck:
    description: Статические проверки
    needs: [implement]
    steps:
      - id: tsc
        run: [npx, tsc, --noEmit]
        timeout: 5m
        expect: [{ exit_code: 0 }]
      - id: lint
        run: [npm, run, lint]
        timeout: 5m
        expect: [{ exit_code: 0 }]

  review:
    uses: ./jobs/review.yml
    with: { severity_gate: high }
    needs: [typecheck]
    if: "not inputs.skip_review"

  # on: success не блокируется пропущенным review — пропуск не отказ.
  archive:
    description: Синхронизировать спеки и заархивировать change
    needs: [review]
    steps:
      - id: sync
        run: [npx, openspec, sync, "${inputs.change}"]
        timeout: 3m
        expect: [{ exit_code: 0 }]
      - id: archive
        run: [npx, openspec, archive, "${inputs.change}"]
        timeout: 3m
        expect: [{ exit_code: 0 }]

  triage:
    description: Разбор отказа — что именно не сошлось и почему
    needs: all
    on: failure
    budget: { tokens: 120k }
    output:
      from: analyze
      schema: ./schemas/triage.json
    steps:
      - id: analyze
        agent: claude
        prompt: file:./prompts/triage.md
        context:
          - path: ${run.dir}/status.json
            mode: inline
        output_schema: ./schemas/triage.json
        timeout: 10m
        expect:
          - schema: ./schemas/triage.json
