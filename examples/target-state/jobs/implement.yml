# Работа: реализовать задачи из плана до зелёной сборки и тестов.
# Ничего не знает о том, кто её запускает и что будет после неё.

version: 1
kind: job
name: implement
description: Реализовать задачи из плана до зелёной сборки и тестов

params:
  change: { type: string, required: true }
  max_iterations: { type: int, default: 4 }

# Оба агентских шага идут в одной сессии: review-self видит, что делал write-code.
session: shared

context:
  - openspec/changes/${params.change}/tasks.md

output:
  from: review-self
  schema: ../schemas/implement.json

budget:
  tokens: 900k
  wallclock: 45m

until:
  max_iterations: ${params.max_iterations}
  check:
    - cmd: npm run build
    - cmd: npm test

steps:
  - id: write-code
    agent: claude
    prompt: file:../prompts/implement.md
    permissions:
      allow: ["Edit", "Read", "Bash(npm *)", "Bash(git diff*)"]
    timeout: 25m
    budget: { tokens: 180k }
    expect:
      - changed_only:
          - src/**
          - test/**
          - openspec/changes/${params.change}/tasks.md
      - cmd: npx tsc --noEmit
    attempts:
      max: 3
      escalation:
        - include_failure: true
        - include_failure: true
          model: opus

  - id: review-self
    agent: claude
    prompt: file:../prompts/implement-summary.md
    output_schema: ../schemas/implement.json
    timeout: 10m
    budget: { tokens: 60k }
    expect:
      - schema: ../schemas/implement.json
